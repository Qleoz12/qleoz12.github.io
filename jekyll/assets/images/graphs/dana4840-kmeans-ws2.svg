  <!-- Data region x:[-4,6] y:[-3,4] -> px=72+(x+4)/10*396, py=332-(y+3)/7*276 -->
  <line x1="72" y1="332" x2="468" y2="332" stroke="#444" stroke-width="1.2"/>
  <line x1="72" y1="332" x2="72" y2="56" stroke="#444" stroke-width="1.2"/>
  <text x="270" y="398" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13">x1</text>
  <text x="28" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" transform="rotate(-90 28 200)">x2</text>
  <text x="72" y="348" text-anchor="middle" font-size="10" fill="#555">-4</text>
  <text x="468" y="348" text-anchor="middle" font-size="10" fill="#555">6</text>
  <text x="62" y="336" text-anchor="end" font-size="10" fill="#555">-3</text>
  <text x="62" y="60" text-anchor="end" font-size="10" fill="#555">4</text>
  <!-- Centroid 2 -->
  <polygon points="190.8,247.1 198.6,259.2 183.0,259.2" fill="#1a5276" stroke="#0d2c40" stroke-width="1.3"/>
  <text x="206" y="262" font-family="system-ui,sans-serif" font-size="11" fill="#1a5276">C2 (-1,-1)</text>
  <!-- Items B C D -->
  <circle cx="190.8" cy="174.3" r="11" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="190.8" y="178.3" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#fff" font-weight="700">B</text>
  <circle cx="270.0" cy="292.6" r="11" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="270.0" y="296.6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#fff" font-weight="700">C</text>
  <circle cx="111.6" cy="292.6" r="11" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="111.6" y="296.6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#fff" font-weight="700">D</text>
  <!-- Centroid 1 (same coords as A): star marker -->
  <text x="428.4" y="88" text-anchor="middle" font-size="26" fill="#c0392b" font-family='Georgia,serif' font-weight='bold'>*</text>
