  <circle cx="428.4" cy="95.4" r="12" fill="#c0392b" stroke="#7b241c" stroke-width="2"/>
  <text x="428.4" y="99.4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#fff" font-weight="700">A</text>
  <text x="428.4" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7b241c" font-weight="600">Centroid 1 (5, 3)</text>
