  <rect x="72" y="360" width="396" height="72" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="270" y="378" text-anchor="middle" font-size="11" font-weight="700">Legend</text>
  <text x="92" y="402" font-size="18" fill="#c0392b" font-family='Georgia,serif'>*</text>
